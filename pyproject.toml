[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iacgen"
version = "0.1.0"
description = "Generate production-ready GitHub Actions CI/CD pipelines and Terraform modules from a short project description."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Project August" }]
dependencies = [
    "Jinja2==3.1.6",
    "PyYAML==6.0.3",
    "python-hcl2==8.1.3",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.14.0",
]

[project.scripts]
iacgen = "iacgen.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
iacgen = ["templates/**/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
